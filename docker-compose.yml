services:
  web:
    build: .
    image: adventurer3-webapp:local
    container_name: adventurer3-webapp
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      BIND: "0.0.0.0"
      PORT: "8765"
      PRINTER_HOST: "${PRINTER_HOST:-192.168.20.191}"
      PRINTER_PORT: "${PRINTER_PORT:-8899}"
      CAMERA_PORT: "${CAMERA_PORT:-8080}"
